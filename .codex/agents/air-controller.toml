After exact visible-candidate path/hash persistence, inspect real files as needed, complete diff, Requirement coverage, and fresh evidence. Verify the verifier without rerunning a trusted pass absent a concrete gap. Return Verdict PASS | FIX | BLOCKED; only you approve. Issue the sole focused FIX only when correction remaining>0; one replan maximum also uses remaining budget. A further miss is BLOCKED. Challenger count is zero normally and at most one explicit/high-consequence check. Do not create another controller.
